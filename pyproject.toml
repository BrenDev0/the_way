[project]
name = "the-way"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=13.2.0",
    "alembic>=1.20.0",
    "python-docx>=1.1.2",
    "pypdf>=5.1.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "botocore>=1.40.61",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "langchain-anthropic>=1.7.2",
    "langchain-openai>=1.6.3",
    "pydantic-settings>=2.15.0",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.54",
    "taskiq>=0.12.6",
    "taskiq-fastapi>=0.5.0",
    "taskiq-redis>=1.2.3",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "watchfiles>=1.3.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

name: the-way

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://the_way:${POSTGRES_PASSWORD}@postgres:5432/the_way
  REDIS_URL: redis://redis:6379/0
  TASKIQ_BROKER_URL: redis://redis-queue:6379/0
  TASKIQ_RESULT_BACKEND_URL: redis://redis-queue:6379/1
  CRYPTOGRAPHY_FERNET_KEY: ${CRYPTOGRAPHY_FERNET_KEY}
  REQUEST_SIGNING_SECRET: ${REQUEST_SIGNING_SECRET}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  INVITATION_ACCEPT_URL: ${INVITATION_ACCEPT_URL}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  BUCKET_NAME: ${BUCKET_NAME}
  BUCKET_PREFIX: ${BUCKET_PREFIX}
  BUCKET_ENDPOINT: http://s3:9090
  BUCKET_REGION: ${BUCKET_REGION}
  BUCKET_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
  BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: the_way
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: the_way
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U the_way -d the_way"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-queue:
    image: redis:8-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30


  s3:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090"

  s3-bucket:
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      - s3
    command:
      - "-sS"
      - "--retry"
      - "60"
      - "--retry-delay"
      - "2"
      - "--retry-connrefused"
      - "--retry-all-errors"
      - "-X"
      - "PUT"
      - "http://s3:9090/${BUCKET_NAME}"

  migrate:
    image: ${APP_IMAGE}
    restart: "no"
    command: alembic upgrade head
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${APP_IMAGE}
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    environment: *app-environment
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      s3:
        condition: service_started

  worker:
    image: ${APP_IMAGE}
    restart: unless-stopped
    command: taskiq worker src.worker.main:broker --workers 1
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      s3:
        condition: service_started

volumes:
  postgres_data:
  redis_queue_data:

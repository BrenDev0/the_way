name: the-way

x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://the_way:${POSTGRES_PASSWORD}@postgres:5432/the_way
  REDIS_URL: redis://redis:6379/0
  TASKIQ_BROKER_URL: redis://redis-queue:6379/0
  TASKIQ_RESULT_BACKEND_URL: redis://redis-queue:6379/1
  CRYPTOGRAPHY_FERNET_KEY: ${CRYPTOGRAPHY_FERNET_KEY}
  REQUEST_SIGNING_SECRET: ${REQUEST_SIGNING_SECRET}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
  INVITATION_ACCEPT_URL: ${INVITATION_ACCEPT_URL}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  BUCKET_NAME: ${BUCKET_NAME}
  BUCKET_PREFIX: ${BUCKET_PREFIX}
  BUCKET_ENDPOINT: http://s3:9090
  # where a client reaches the bucket and the API -- this machine here; the real addresses
  # once deployed (see .env.example). 127.0.0.1 rather than localhost for the bucket: on
  # Windows with Docker, Node's localhost connections can hang or reset (an upload failed
  # with ECONNRESET), and the desktop app uploads to this address straight from Node.
  BUCKET_PUBLIC_ENDPOINT: ${BUCKET_PUBLIC_ENDPOINT:-http://127.0.0.1:9090}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
  FILE_LINK_SECRET: ${FILE_LINK_SECRET:-}
  BUCKET_REGION: ${BUCKET_REGION}
  BUCKET_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
  BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
  RENDER_URL: http://render:8100
  RENDER_SHARED_SECRET: ${RENDER_SHARED_SECRET:-}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: the_way
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: the_way
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U the_way -d the_way"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-queue:
    image: redis:8-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    ports:
      - "6380:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30


  # Project files' bytes live here; the database only lists them, so the volume is what
  # keeps a file listed and present across rebuilds. MinIO speaks the S3 API at the same
  # address S3Mock did (s3:9090), so nothing else changes. MinIO stopped publishing its own
  # images in October 2025; Chainguard builds it from source and keeps it current.
  # Its web console: http://localhost:9001, signed in with the bucket keys.
  s3:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9090", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${BUCKET_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${BUCKET_SECRET_ACCESS_KEY}
      MINIO_REGION: ${BUCKET_REGION:-us-east-1}
      # where the health check finds it: mc assumes port 9000
      MC_HOST_local: http://localhost:9090
    ports:
      - "9090:9090"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the bucket once MinIO is up; does nothing if it is already there.
  s3-bucket:
    image: cgr.dev/chainguard/minio-client:latest
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${BUCKET_ACCESS_KEY_ID}:${BUCKET_SECRET_ACCESS_KEY}@s3:9090
    command: ["mb", "--ignore-existing", "local/${BUCKET_NAME}"]

  migrate:
    image: ${APP_IMAGE}
    restart: "no"
    command: alembic upgrade head
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${APP_IMAGE}
    restart: unless-stopped
    command: uvicorn src.fastapi.main:app --host 0.0.0.0 --port 8000
    environment: *app-environment
    networks: [default, render]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      s3-bucket:
        condition: service_completed_successfully

  worker:
    image: ${APP_IMAGE}
    restart: unless-stopped
    # One process; concurrency inside it. --max-async-tasks is how many tasks (turns,
    # document ingestions, background jobs) run at once -- the rest wait in Redis, safely:
    # a message is acknowledged only once its task is done. The thread pool caps the
    # CPU-heavy work done in threads (WeasyPrint exports, text extraction, images). To scale,
    # add worker containers: each one is its own consumer.
    command: >
      taskiq worker src.worker.main:broker
      --workers 1
      --max-async-tasks ${TASKIQ_MAX_ASYNC_TASKS:-50}
      --max-threadpool-threads ${TASKIQ_MAX_THREADPOOL_THREADS:-8}
    environment:
      <<: *app-environment
      # about one connection per running task: 25 + 30 here, 10 + 20 for the api,
      # 85 together under Postgres's 100
      DATABASE_POOL_SIZE: ${WORKER_DATABASE_POOL_SIZE:-25}
      DATABASE_MAX_OVERFLOW: ${WORKER_DATABASE_MAX_OVERFLOW:-30}
    networks: [default, render]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      s3-bucket:
        condition: service_completed_successfully

  # A real Chromium for screenshots, page checks and single-page PDFs (src/render). It
  # renders HTML an agent wrote, so it is fenced off: its own image (the only one with a
  # browser), none of the app's secrets -- deliberately not *app-environment -- and only
  # the `render` network, so it cannot reach postgres, redis or the bucket. The network
  # still has a way out, for Google Fonts; every other address is refused in code
  # (src/render/browser.py). No published port: only api and worker reach it.
  render:
    image: ${RENDER_IMAGE:-the-way-render:local}
    restart: unless-stopped
    environment:
      RENDER_SHARED_SECRET: ${RENDER_SHARED_SECRET:-}
    networks: [render]
    mem_limit: 1g
    cpus: 1.0
    shm_size: 256m
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  render:

volumes:
  postgres_data:
  redis_queue_data:
  minio_data:

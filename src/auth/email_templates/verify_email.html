<h1 style="margin:0 0 12px;font-family:'IBM Plex Sans','Segoe UI',Arial,sans-serif;font-size:24px;line-height:30px;font-weight:600;color:#ecf5f4;">Verifica tu correo</h1>
<p style="margin:0 0 22px;">Escribe este código en la pantalla de verificación para terminar de crear tu cuenta.</p>

<p style="margin:22px 0 0;font-size:13px;line-height:21px;color:#899ca8;">El código vence en 15 minutos. Si no lo pediste, ignora este correo: sin el código no se crea ninguna cuenta.</p>

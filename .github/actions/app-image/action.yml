name: Load the app image
description: >
  Builds the app image from the Dockerfile and loads it into this job's Docker as the-way:ci.
  The build job has already filled the cache, so this mostly unpacks layers.

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    - uses: docker/build-push-action@v6
      with:
        context: .
        target: app
        load: true
        tags: the-way:ci
        cache-from: type=gha,scope=app

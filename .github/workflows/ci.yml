name: CI

# Every push and pull request: build the image, then ruff, mypy, the unit tests and the
# integration tests, each as its own job, so the run shows which one failed. When all of them
# pass on main, build and push the images to Docker Hub. A pull request never pushes anything.
#
# Needs, in Settings > Secrets and variables > Actions:
#   variable  DOCKERHUB_USERNAME
#   secret    DOCKERHUB_TOKEN        (a Docker Hub personal access token with Read & Write)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request replaces the run in progress; main always finishes,
# so every commit that lands is tested and published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Builds the app image from the Dockerfile and keeps its layers in the cache. The checks run
  # in that image, so they see the same Python and system libraries the app does, and a
  # Dockerfile that stops building fails here, before anything else starts.
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: false
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  ruff:
    name: Ruff
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-image
      - run: docker run --rm the-way:ci ruff check .

  mypy:
    name: Mypy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-image
      - run: docker run --rm the-way:ci mypy src

  unit:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-image
      # No services: the unit tests use fakes, and --network none proves it.
      - run: docker run --rm --network none the-way:ci python -m pytest tests/unit -q -p no:cacheprovider

  integration:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-image
      # Postgres, Redis and MinIO as throwaway containers; see the script.
      - run: bash .github/scripts/integration.sh the-way:ci

  # Only after every check passed, and only for a commit that landed on main.
  push:
    name: Push ${{ matrix.image }}
    needs: [ruff, mypy, unit, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: the_way_backend
            target: app
          - image: the_way_render
            target: render
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest is what Railway runs; sha-<short> pins this exact build, to roll back to.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the app layers the build job cached come from the cache, so this mostly pushes
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
          provenance: false

name: CI

# Lint and test every push and pull request. When everything passes on main, build the images
# and push them to Docker Hub. A pull request never pushes anything.
#
# Needs, in Settings > Secrets and variables > Actions:
#   variable  DOCKERHUB_USERNAME
#   secret    DOCKERHUB_TOKEN        (a Docker Hub personal access token with Read & Write)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request replaces the run in progress; main always finishes,
# so every commit that lands is tested and published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The image the tests run in: built from the Dockerfile, so they run on the same Python and
  # system libraries the app does, and a Dockerfile that no longer builds fails here.
  TEST_IMAGE: the-way:ci

jobs:
  test:
    name: Ruff and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Ruff
        run: docker run --rm "$TEST_IMAGE" ruff check .

      # No services: the unit tests use fakes, and --network none proves it.
      - name: Unit tests
        run: docker run --rm --network none "$TEST_IMAGE" python -m pytest tests/unit -q -p no:cacheprovider

      # Postgres, Redis and MinIO as throwaway containers; see the script.
      - name: Integration tests
        run: .github/scripts/integration.sh "$TEST_IMAGE"

  # Only after every check above passed, and only for a commit that landed on main.
  push:
    name: Push ${{ matrix.image }}
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: the_way_backend
            target: app
          - image: the_way_render
            target: render
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest is what Railway runs; sha-<short> pins this exact build, to roll back to.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the layers the test job just built come from the cache, so this mostly pushes
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
          provenance: false
